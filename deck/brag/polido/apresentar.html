<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroParts · apresentar</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f3f4f2; overflow: hidden; }
      body.oculto { cursor: none; }
      #quadro { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
      #toque { position: fixed; inset: 0; }
      /* Modo apresentador: só para quem fala, numa segunda janela. */
      body.notas { background: #15191a; color: #f3f4f2; font-family: "Barlow", sans-serif; overflow: auto; }
      body.notas #quadro, body.notas #toque { display: none; }
      #painel { display: none; padding: 48px 64px; max-width: 1100px; }
      body.notas #painel { display: block; }
      #painel .conta { font-size: 28px; color: #c7cccd; display: flex; gap: 32px; }
      #painel .fala { font-size: 44px; line-height: 1.35; margin: 32px 0 48px; white-space: pre-line; }
      #painel .depois { font-size: 26px; line-height: 1.4; color: #c7cccd; white-space: pre-line; }
      #painel .ajuda { margin-top: 48px; font-size: 20px; color: #8f989b; }
      @font-face { font-family: "Barlow"; font-weight: 400; src: url("assets/fonts/barlow-latin-400-normal.woff2") format("woff2"); }
    </style>
  </head>
  <body>
    <iframe id="quadro" title="Deck AgroParts" tabindex="-1"></iframe>
    <div id="toque" aria-hidden="true"></div>
    <section id="painel" aria-live="polite">
      <div class="conta"><span id="p-conta"></span><span id="p-relogio">0:00</span></div>
      <p class="fala" id="p-fala"></p>
      <p class="depois" id="p-depois"></p>
      <p class="ajuda">→ ou espaço avança · ← volta · F tela cheia na janela do deck</p>
    </section>
    <script>
      const modoNotas = new URLSearchParams(location.search).has("notas");
      const canal = new BroadcastChannel("agroparts-deck-polido");
      const quadro = document.getElementById("quadro");
      if (!modoNotas) quadro.src = "index.html?v=" + Date.now();

      // Paradas: cada slide tem um ou mais trechos "entra-para"; a seta toca um trecho e para no fim.
      let paradas = [];
      let slides = [];
      let pos = -1;
      let tl = null;
      let animando = null;

      function lerDeck(doc) {
        const falas = JSON.parse(doc.getElementById("falas")?.textContent || "{}");
        slides = [...doc.querySelectorAll("section.slide")].map((el, i) => {
          const inicio = +el.dataset.start;
          const fim = inicio + +el.dataset.duration;
          return { el, i, id: el.id, inicio, fim, saida: inicio + +el.dataset.saida, fala: falas[el.id] || "" };
        });
        paradas = slides.flatMap((s) =>
          s.el.dataset.paradas.split(",").map((trecho, k) => {
            const [entra, para] = trecho.split("-").map((n) => s.inicio + +n);
            return { slide: s, k, entra, para };
          }),
        );
      }

      function mostrarSlidesEm(t) {
        for (const s of slides) s.el.style.visibility = t >= s.inicio && t < s.fim ? "visible" : "hidden";
      }

      function tocar(de, ate) {
        return new Promise((pronto) => {
          tl.pause().seek(de);
          animando = tl.tweenFromTo(de, ate, { ease: "none", onComplete: pronto });
          animando.vars.alvo = ate;
        });
      }

      function terminarAnimacao() {
        if (!animando) return false;
        const alvo = animando.vars.alvo;
        animando.kill();
        animando = null;
        tl.seek(paradas[pos].para);
        return alvo !== undefined;
      }

      async function avancar() {
        if (terminarAnimacao()) return;
        if (pos + 1 >= paradas.length) return;
        const atual = paradas[pos];
        const prox = paradas[++pos];
        avisar();
        if (atual && atual.slide !== prox.slide) await tocar(atual.slide.saida, atual.slide.fim - 0.001);
        if (paradas[pos] !== prox) return;
        await tocar(prox.entra, prox.para);
        animando = null;
      }

      function irPara(n) {
        if (animando) { animando.kill(); animando = null; }
        pos = Math.max(-1, Math.min(n, paradas.length - 1));
        tl.pause().seek(pos < 0 ? 0 : paradas[pos].para);
        avisar();
      }

      function avisar() {
        history.replaceState(null, "", "#" + (pos + 1));
        const s = paradas[pos]?.slide;
        const prox = slides[(s ? s.i : -1) + 1];
        canal.postMessage({ tipo: "estado", pos, total: paradas.length, slide: s ? s.i + 1 : 0, slides: slides.length, fala: s?.fala || "", depois: prox?.fala || "" });
      }

      function comando(c) {
        if (c === "avancar") avancar();
        else if (c === "voltar") irPara(pos - 1);
        else if (c === "inicio") irPara(-1);
      }

      function tecla(e) {
        const mapa = { ArrowRight: "avancar", " ": "avancar", PageDown: "avancar", Enter: "avancar", ArrowLeft: "voltar", PageUp: "voltar", Backspace: "voltar", Home: "inicio" };
        if (e.key === "f" || e.key === "F") return telaCheia();
        if (e.key === "p" || e.key === "P") return window.open("apresentar.html?notas", "agroparts-notas", "width=1200,height=800");
        const c = mapa[e.key];
        if (!c) return;
        e.preventDefault();
        if (modoNotas) canal.postMessage({ tipo: "comando", c });
        else comando(c);
      }

      function telaCheia() {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => {});
      }

      function encaixar() {
        const k = Math.min(innerWidth / 1920, innerHeight / 1080);
        quadro.style.transform = `scale(${k}) translate(-50%, -50%)`;
      }

      let relogioInicio = null;
      if (modoNotas) {
        document.body.classList.add("notas");
        canal.onmessage = ({ data }) => {
          if (data.tipo !== "estado") return;
          if (relogioInicio === null && data.pos >= 0) relogioInicio = Date.now();
          document.getElementById("p-conta").textContent = `Slide ${data.slide} de ${data.slides}`;
          document.getElementById("p-fala").textContent = data.fala;
          document.getElementById("p-depois").textContent = data.depois ? "Depois: " + data.depois : "";
        };
        setInterval(() => {
          if (relogioInicio === null) return;
          const s = Math.floor((Date.now() - relogioInicio) / 1000);
          document.getElementById("p-relogio").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        }, 500);
        canal.postMessage({ tipo: "comando", c: "pedir-estado" });
        addEventListener("keydown", tecla);
      } else {
        canal.onmessage = ({ data }) => {
          if (data.tipo !== "comando") return;
          if (data.c === "pedir-estado") avisar();
          else comando(data.c);
        };
        encaixar();
        addEventListener("resize", encaixar);
        quadro.addEventListener("load", async () => {
          const w = quadro.contentWindow;
          await w.document.fonts.ready;
          tl = w.__timelines.deck;
          lerDeck(w.document);
          w.gsap.ticker.add(() => mostrarSlidesEm(tl.time()));
          const inicial = parseInt(location.hash.slice(1), 10);
          irPara(Number.isFinite(inicial) ? inicial - 1 : -1);
          mostrarSlidesEm(tl.time());
          document.documentElement.dataset.pronto = "1";
        });
        addEventListener("keydown", tecla);
        document.getElementById("toque").addEventListener("click", () => {
          if (!document.fullscreenElement) telaCheia();
          avancar();
        });
        let parado;
        addEventListener("mousemove", () => {
          document.body.classList.remove("oculto");
          clearTimeout(parado);
          parado = setTimeout(() => document.body.classList.add("oculto"), 1500);
        });
      }
    </script>
  </body>
</html>
